workflows:
  ios-staging:
    name: iOS - Staging (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Create this group in Codemagic under Team settings / App settings ->
      # Environment variables. It needs one secure variable:
      #   CONFIG_JSON_B64 — output of `base64 -w0 config.json` (staging config,
      #   the gitignored file this project already builds with locally).
      groups:
        - talkam_staging
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.talkamtechservice.app

    # Name of the App Store Connect integration as it appears in Codemagic
    # under Team settings -> Integrations -> Apple Developer Portal (the one
    # holding the App Store Connect API key / .p8 you connected earlier).
    # Replace "talkam" below with whatever you actually named it there.
    integrations:
      app_store_connect: Talkam Service

    triggering:
      events: []
      # No automatic push/PR trigger while this is still being set up —
      # start builds manually from the Codemagic dashboard (pick any
      # branch) until this pipeline is trusted enough to run on its own.

    scripts:
      - name: Write dart-define config from secret
        script: |
          echo "$CONFIG_JSON_B64" | base64 -d > config.json

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          flutter pub get

          # video_thumbnail 0.5.x declares s.ios.deployment_target = '8.0' which
          # CocoaPods rejects at dependency-resolution time because Flutter requires
          # a higher minimum. We search for the podspec anywhere under $HOME (covers
          # all pub-cache layouts) and patch it with perl -i before pod install runs.
          echo "--- Patching video_thumbnail podspec ---"
          find "$HOME" -name "video_thumbnail.podspec" 2>/dev/null | while IFS= read -r f; do
            echo "Found: $f"
            perl -i -pe "s/deployment_target = '8\.0'/deployment_target = '14.0'/g" "$f"
            echo "After: $(grep deployment_target "$f")"
          done

          cd ios && pod install

      - name: Flutter build ipa (staging)
        script: |
          flutter build ipa --release \
            --dart-define-from-file=config.json \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      # Reuses the same App Store Connect API key already generated
      # (Users and Access -> Integrations) and connected in Codemagic's
      # Apple Developer Portal integration — no separate credential needed.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
