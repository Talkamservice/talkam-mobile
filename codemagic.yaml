workflows:
  ios-staging:
    name: iOS - Staging (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Create this group in Codemagic under Team settings / App settings ->
      # Environment variables. It needs one secure variable:
      #   CONFIG_JSON_B64 — output of `base64 -w0 config.json` (staging config,
      #   the gitignored file this project already builds with locally).
      groups:
        - talkam_staging
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.talkamtechservice.app

    # Name of the App Store Connect integration as it appears in Codemagic
    # under Team settings -> Integrations -> Apple Developer Portal (the one
    # holding the App Store Connect API key / .p8 you connected earlier).
    # Replace "talkam" below with whatever you actually named it there.
    integrations:
      app_store_connect: Talkam Service

    triggering:
      events: []
      # No automatic push/PR trigger while this is still being set up —
      # start builds manually from the Codemagic dashboard (pick any
      # branch) until this pipeline is trusted enough to run on its own.

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache

    scripts:
      - name: Write dart-define config from secret
        script: |
          echo "$CONFIG_JSON_B64" | base64 -d > config.json

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install FlutterFire CLI
        script: |
          # The "FlutterFire: flutterfire upload-crashlytics-symbols" Xcode
          # run-script build phase (baked into Runner.xcodeproj) shells out
          # to the `flutterfire` CLI and expects it on $HOME/.pub-cache/bin.
          # It's a separate global Dart package, not bundled with Flutter,
          # so it has to be activated explicitly before archiving.
          dart pub global activate flutterfire_cli

      - name: Install CocoaPods dependencies
        script: |
          flutter pub get
          cd ios
          success=false
          for i in 1 2 3; do
            if pod install --verbose; then
              success=true
              break
            fi
            echo "pod install failed (attempt $i), clearing CocoaPods download cache and retrying..."
            rm -rf "$HOME/Library/Caches/CocoaPods"
            sleep 15
          done
          $success

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Flutter build ipa (staging)
        script: |
          # xcode-project use-profiles (previous step) writes a matching
          # manual-signing export options plist to $HOME/export_options.plist.
          # Our own ios/ExportOptions.plist says signingStyle: automatic,
          # which overrides that and makes exportArchive look for an
          # Xcode-account-based signing identity that doesn't exist on this
          # machine ("No Accounts" / "No signing certificate 'iOS
          # Distribution' found") instead of the profile use-profiles fetched.
          flutter build ipa --release \
            --dart-define-from-file=config.json \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      # Reuses the same App Store Connect API key already generated
      # (Users and Access -> Integrations) and connected in Codemagic's
      # Apple Developer Portal integration — no separate credential needed.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
