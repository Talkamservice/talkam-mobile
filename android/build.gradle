
allprojects {
    repositories {
        google()
        mavenCentral()
    }
   configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.google.errorprone" &&
                details.requested.name == "error_prone_annotations") {
                details.useVersion "2.5.1"
            }
            if (details.requested.group == "androidx.core") {
                details.useVersion "1.13.1"
            }
            if (details.requested.group == "androidx.activity") {
                details.useVersion "1.9.3"
            }
            if (details.requested.group == "androidx.browser") {
                details.useVersion "1.8.0"
            }
            if (details.requested.group == "androidx.media3") {
                details.useVersion "1.4.1"
            }
            if (details.requested.group == "androidx.navigationevent") {
                details.useVersion "1.0.0"
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        // Plugins that declare no jvmTarget let Kotlin follow the JDK (17) while
        // Java falls back to AGP's default (1.8); Kotlin 2.x rejects the mismatch.
        // sentry_flutter also hardcodes languageVersion "1.6", which Kotlin 2.2+ no longer supports.
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "17"
            kotlinOptions.languageVersion = "1.9"
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

apply from: 'pusher_channels_flutter_fix.gradle'
